[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage settings
addopts = 
    --cov=src
    --cov-report=term
    --cov-report=html:coverage_report
    --cov-report=xml:coverage.xml
    --cov-fail-under=90
    -v

# Coverage exclusions
[coverage:run]
omit = 
    */venv/*
    */.venv/*
    */tests/*
    */__pycache__/*
    */.pytest_cache/*
    */site-packages/*
    */distutils/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if __name__ == .__main__.:
    pass
    raise ImportError
